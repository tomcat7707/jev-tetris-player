name: unit-tests

on:
  push:
    branches:
      - "experiment/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax check
        run: python -m py_compile main.py tetris_engine.py jev_agent.py telemetry.py path_planner.py
      - name: Run engine tests
        run: python -m unittest -v
